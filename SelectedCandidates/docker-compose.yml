# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.yml — RedRob Top-100 Streamlit Dashboard
#
# Build context is SelectedCandidates/ (this folder).
# Run from inside SelectedCandidates/:
#
#   docker compose up --build          → build image + start dashboard
#   docker compose up -d               → start in background
#   docker compose down                → stop and remove containers
#   docker compose logs -f dashboard   → tail live logs
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Streamlit Analytics Dashboard ────────────────────────────────────────
  dashboard:
    build:
      # Build context = SelectedCandidates/ (current directory)
      context: .
      dockerfile: Dockerfile
      # Give the built image a name so it can be reused without rebuilding
      tags:
        - redrob-dashboard:latest

    image: redrob-dashboard:latest

    container_name: redrob-dashboard

    ports:
      # host:container  →  open http://localhost:8501 in your browser
      - "8501:8501"

    # ── Volume mounts ───────────────────────────────────────────────────────
    # Override the baked-in outputs at runtime (useful during development or
    # when you re-run the pipeline and want the dashboard to pick up new data
    # without rebuilding the image).
    volumes:
      - ./outputs:/app/outputs:ro        # pipeline outputs (read-only)
      - ./app:/app/app:ro                # hot-reload the app code (dev only)

    # ── Environment ─────────────────────────────────────────────────────────
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
      - STREAMLIT_THEME_BASE=dark
      - STREAMLIT_SERVER_ENABLE_WEBSOCKET_COMPRESSION=false

    # ── Resource limits (optional, tweak as needed) ──────────────────────
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

    # ── Restart policy ───────────────────────────────────────────────────
    restart: unless-stopped

    # ── Health check ─────────────────────────────────────────────────────
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
