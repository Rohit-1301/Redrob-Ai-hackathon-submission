version: '3.8'

services:
  pipeline:
    image: redrob-ranking:latest
    build:
      context: ../
      dockerfile: SelectedCandidates/Dockerfile
    volumes:
      - ./outputs:/app/SelectedCandidates/outputs
      - ./reports:/app/SelectedCandidates/reports
      - ./models:/app/SelectedCandidates/models
      - ./logs:/app/SelectedCandidates/logs
    environment:
      - JD_PATH=Redrobsdataset/job_description.docx
      - VALID_PATH=Preprocessing pipeline/output/valid.json
      - REVIEW_PATH=Preprocessing pipeline/output/review.json
      - WEAK_PATH=Preprocessing pipeline/output/weak.json

  dashboard:
    image: redrob-ranking:latest
    build:
      context: ../
      dockerfile: SelectedCandidates/Dockerfile
    ports:
      - "8501:8501"
    command: ["streamlit", "run", "SelectedCandidates/app/streamlit_app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    volumes:
      - ./outputs:/app/SelectedCandidates/outputs
      - ./reports:/app/SelectedCandidates/reports
      - ./models:/app/SelectedCandidates/models
      - ./logs:/app/SelectedCandidates/logs
    depends_on:
      - pipeline
